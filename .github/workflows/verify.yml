name: Проверка публикаций — тесты

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: npm ci
      - name: Test document dependencies
        run: python -m pip install python-docx
      - name: Restore existing OpenAlex build key (public client key)
        run: |
          python - <<'PY'
          import json, pathlib, re, sys
          app = pathlib.Path('docs/app.js').read_text(encoding='utf-8')
          match = re.match(r'const ORCID_BUILTIN = .*?, OA_BUILTIN = ("(?:[^"\\]|\\.)*");', app)
          if not match: sys.exit('Не удалось восстановить встроенный ключ из docs/app.js')
          key = json.loads(match.group(1))
          if not re.fullmatch(r'[A-Za-z0-9_-]{8,128}', key): sys.exit('В docs/app.js нет действующего встроенного ключа')
          pathlib.Path('openalex_key.txt').write_text(key, encoding='utf-8')
          print('Ключ OpenAlex подготовлен из опубликованной клиентской сборки; значение скрыто')
          PY
      - name: Reject build without OpenAlex key
        run: |
          mv openalex_key.txt openalex_key.txt.test
          if python build.py > /tmp/build_missing_key.log 2>&1; then
            echo "ERROR: сборка без ключа не должна проходить"; exit 1
          fi
          grep -q "отсутствует openalex_key.txt" /tmp/build_missing_key.log || (cat /tmp/build_missing_key.log; exit 1)
          mv openalex_key.txt.test openalex_key.txt
      - name: Build
        run: python build.py
      - name: Logic tests
        run: node evals/run.js
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        env:
          LANG: C.UTF-8
        run: node evals/browser.js
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evals
          path: evals/out.*
          if-no-files-found: ignore
